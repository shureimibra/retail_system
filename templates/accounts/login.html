{% extends 'base.html' %}

{% block title %}Login - Retail RMS{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] transition-colors duration-300">
    <div class="w-full max-w-md glassmorphism rounded-3xl p-8 md:p-10 shadow-soft transition-all duration-500 relative overflow-hidden group border border-bordercolor neon-cyan">
        <div class="absolute inset-x-0 top-0 h-1.5 bg-gradient-to-r from-primary via-secondaryaccent to-danger"></div>
        
        <!-- Header -->
        <div class="mb-8 text-center">
            <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:rotate-6 transition-transform duration-300">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-3xl font-extrabold text-textprimary tracking-tight">Access Control</h2>
            <p class="text-sm text-textsecondary mt-2">Sign in to manage retail constraints & recovery.</p>
        </div>
        
        <!-- Form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
            <div class="p-3 bg-danger/10 border border-danger/25 text-danger text-sm rounded-xl font-medium animate-pulse">
                {{ form.non_field_errors.0 }}
            </div>
            {% endif %}

            <div class="space-y-1.5">
                <label for="{{ form.username.id_for_label }}" class="block text-xs font-bold uppercase tracking-wider text-textsecondary">Username</label>
                <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" required
                       class="w-full px-4 py-3.5 rounded-xl border border-bordercolor bg-bgprimary text-textprimary placeholder-textmuted focus:ring-2 focus:ring-primary focus:outline-none transition-all text-sm font-medium"
                       placeholder="Enter username">
            </div>
            
            <div class="space-y-1.5">
                <label for="{{ form.password.id_for_label }}" class="block text-xs font-bold uppercase tracking-wider text-textsecondary">Password</label>
                <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" required
                       class="w-full px-4 py-3.5 rounded-xl border border-bordercolor bg-bgprimary text-textprimary placeholder-textmuted focus:ring-2 focus:ring-primary focus:outline-none transition-all text-sm font-medium"
                       placeholder="••••••••">
            </div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-primary focus:ring-primary border-bordercolor rounded bg-bgprimary">
                    <label for="remember-me" class="ml-2 block text-sm text-textsecondary font-medium select-none">Remember me</label>
                </div>
            </div>
            
            <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-glow-cyan text-sm font-bold text-white bg-primary hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-300 transform active:scale-95">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
