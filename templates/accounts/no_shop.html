{% extends "auth_base.html" %}
{% block title %}No shop yet{% endblock %}
{% block content %}
<h1>Your account isn't linked to a shop yet</h1>
<p class="muted">Ask the shop owner to add you in Settings → Team and roles. Then sign in again.</p>
<form action="{% url 'accounts:logout' %}" method="post">{% csrf_token %}<button type="submit" class="btn">Sign out</button></form>
{% endblock %}
