{% load ui %}{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pages">
  {% if page_obj.has_previous %}<a class="btn btn-sm" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">{% icon "chevron-left" "sm" %}Newer</a>{% else %}<span></span>{% endif %}
  <span class="faint small">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn btn-sm" href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Older{% icon "chevron-right" "sm" %}</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
